<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Header image</title>
<style>
  body { margin: 0; padding: 16px; font-family: system-ui, "Segoe UI", Arial, sans-serif; background: #f4f4f5; color: #111; }
  canvas { display: block; max-width: 100%; height: auto; box-shadow: 0 2px 12px rgba(0,0,0,.25); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  button { padding: 10px 14px; font-size: 15px; border: 0; border-radius: 6px; background: #111; color: #fff; cursor: pointer; }
  p { max-width: 62ch; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div class="bar">
  <button data-f="png">Download PNG</button>
  <button data-f="jpeg">Download JPG</button>
  <button data-f="webp">Download WebP</button>
</div>
<canvas id="c"></canvas>
<p id="size"></p>
<p>If a download button does nothing here: right-click the picture and choose "Save image as...", or save this page as an .html file and open it in your browser, then use the buttons.</p>
<script>
// ===== EDIT ONLY THIS BLOCK =====
// Positions are fractions of the width (x, w) and height (y, h): 0 = left/top, 1 = right/bottom.
const CONFIG = {
  width: 1200,
  height: 630,
  background: { from: '#0f4c5c', to: '#1b7f8c', angle: 135 },   // same colour twice = solid
  shapes: [                                                       // optional decoration, drawn first
    { type: 'circle', x: 0.92, y: 0.15, r: 0.28, color: '#ffffff', alpha: 0.08 },
    { type: 'circle', x: 0.80, y: 1.05, r: 0.30, color: '#e36414', alpha: 0.9 },
    { type: 'rect',   x: 0.07, y: 0.20, w: 0.06, h: 0.012, color: '#e36414', alpha: 1 }
  ],
  illustration: null,   // or { svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">...</svg>', x: 0.58, y: 0.1, w: 0.36, h: 0.8 }
  kicker: 'GUIDE',                      // small line above the title, '' for none
  title: 'How to store bread so it stays fresh',
  subtitle: '',                         // '' for none
  textColor: '#ffffff',
  kickerColor: '#ffb703',
  align: 'left',                        // 'left' or 'center'
  textBox: { x: 0.07, y: 0.28, w: 0.55, h: 0.5 },   // where the title may go
  fontFamily: '"Segoe UI", "Helvetica Neue", Arial, sans-serif',
  titleWeight: 800,
  logoText: 'myblog.com',               // '' for none
  logoColor: '#ffffff',
  logoPos: { x: 0.93, y: 0.93, align: 'right' }
};
// ===== END OF EDITABLE BLOCK =====

const cv = document.getElementById('c');
cv.width = CONFIG.width; cv.height = CONFIG.height;
const ctx = cv.getContext('2d');
const W = CONFIG.width, H = CONFIG.height;
document.getElementById('size').textContent = 'Size: ' + W + ' x ' + H + ' px';

function wrap(text, maxW) {
  const words = text.split(/\s+/), lines = [];
  let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width <= maxW || !line) line = t;
    else { lines.push(line); line = w; }
  }
  if (line) lines.push(line);
  return lines;
}

function drawBackground() {
  const b = CONFIG.background, a = (b.angle || 0) * Math.PI / 180;
  const cx = W / 2, cy = H / 2, d = Math.abs(W * Math.cos(a)) / 2 + Math.abs(H * Math.sin(a)) / 2;
  const g = ctx.createLinearGradient(cx - Math.cos(a) * d, cy - Math.sin(a) * d, cx + Math.cos(a) * d, cy + Math.sin(a) * d);
  g.addColorStop(0, b.from); g.addColorStop(1, b.to);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function drawShapes() {
  for (const s of CONFIG.shapes || []) {
    ctx.globalAlpha = s.alpha == null ? 1 : s.alpha;
    ctx.fillStyle = s.color;
    if (s.type === 'circle') { ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r * W, 0, Math.PI * 2); ctx.fill(); }
    else if (s.type === 'rect') ctx.fillRect(s.x * W, s.y * H, s.w * W, s.h * H);
  }
  ctx.globalAlpha = 1;
}

function drawText() {
  const box = CONFIG.textBox, bx = box.x * W, by = box.y * H, bw = box.w * W, bh = box.h * H;
  const left = CONFIG.align === 'center';
  ctx.textBaseline = 'top';
  ctx.textAlign = left ? 'center' : 'left';
  const ax = left ? bx + bw / 2 : bx;
  let size = Math.round(H * 0.14), lines, lineH;
  const hasKicker = !!CONFIG.kicker, hasSub = !!CONFIG.subtitle;
  for (; size >= 24; size -= 2) {
    ctx.font = CONFIG.titleWeight + ' ' + size + 'px ' + CONFIG.fontFamily;
    lines = wrap(CONFIG.title, bw);
    lineH = size * 1.15;
    const total = lines.length * lineH + (hasKicker ? size * 0.6 : 0) + (hasSub ? size * 0.7 : 0);
    if (lines.length <= 4 && total <= bh) break;
  }
  let y = by;
  if (hasKicker) {
    const ks = Math.max(18, Math.round(size * 0.38));
    ctx.font = '700 ' + ks + 'px ' + CONFIG.fontFamily;
    ctx.fillStyle = CONFIG.kickerColor;
    ctx.fillText(CONFIG.kicker.toUpperCase().split('').join(String.fromCharCode(8202)), ax, y);
    y += size * 0.6;
  }
  ctx.font = CONFIG.titleWeight + ' ' + size + 'px ' + CONFIG.fontFamily;
  ctx.fillStyle = CONFIG.textColor;
  for (const l of lines) { ctx.fillText(l, ax, y); y += lineH; }
  if (hasSub) {
    ctx.font = '400 ' + Math.round(size * 0.42) + 'px ' + CONFIG.fontFamily;
    ctx.globalAlpha = 0.9;
    ctx.fillText(CONFIG.subtitle, ax, y + size * 0.15);
    ctx.globalAlpha = 1;
  }
}

function drawLogo() {
  if (!CONFIG.logoText) return;
  const p = CONFIG.logoPos;
  ctx.font = '700 ' + Math.round(H * 0.045) + 'px ' + CONFIG.fontFamily;
  ctx.fillStyle = CONFIG.logoColor;
  ctx.textAlign = p.align || 'right';
  ctx.textBaseline = 'bottom';
  ctx.fillText(CONFIG.logoText, p.x * W, p.y * H);
}

function drawIllustration() {
  return new Promise((resolve) => {
    const il = CONFIG.illustration;
    if (!il || !il.svg) return resolve();
    const img = new Image();
    img.onload = () => {
      // keep the drawing's own proportions: fit it inside the box and centre it
      const m = il.svg.match(/viewBox="s*[-d.]+[s,]+[-d.]+[s,]+([d.]+)[s,]+([d.]+)s*"/);
      const ratio = m ? parseFloat(m[1]) / parseFloat(m[2]) : (img.naturalWidth && img.naturalHeight ? img.naturalWidth / img.naturalHeight : 1);
      const bw = il.w * W, bh = il.h * H;
      let dw = bw, dh = bw / ratio;
      if (dh > bh) { dh = bh; dw = bh * ratio; }
      ctx.drawImage(img, il.x * W + (bw - dw) / 2, il.y * H + (bh - dh) / 2, dw, dh);
      resolve();
    };
    img.onerror = () => resolve();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(il.svg);
  });
}

async function render() {
  drawBackground();
  drawShapes();
  await drawIllustration();
  drawText();
  drawLogo();
}

function slug(s) {
  return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'header';
}

document.querySelectorAll('button[data-f]').forEach((btn) => {
  btn.addEventListener('click', () => {
    const f = btn.dataset.f, type = 'image/' + f, ext = f === 'jpeg' ? 'jpg' : f;
    cv.toBlob((blob) => {
      if (!blob) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = slug(CONFIG.title) + '.' + ext;
      document.body.appendChild(a); a.click(); a.remove();
    }, type, 0.9);
  });
});

render();
</script>
</body>
</html>
